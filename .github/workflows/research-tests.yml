name: Research figure regression tests
on:
  pull_request:
    paths:
      - 'scripts/build_research_site.py'
      - 'tests/**'
      - '.github/workflows/research-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline figure extraction tests
        run: python -m unittest discover -s tests -v
